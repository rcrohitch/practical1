<!DOCTYPE html>
<html>
<head>
<style>
body 
form {
  background: #fff;
  padding: 20px;
  width: 280px;
  border-radius: 8px;
  box-shadow: 0 0 10px #0002;
}
input, textarea {
  width: 100%;
  padding: 8px;
  margin: 8px 0;
  border: 1px solid #ccc;
  border-radius: 5px;
}
button {
  width: 100%;
  padding: 10px;
  background: #007bff;
  color: #fff;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}
button:hover { background: #0056b3; }
</style>
</head>

<body>

<form>
  <h3>Contact Us</h3>
  <input type="text" placeholder="Your Name" required>
  <input type="email" placeholder="Your Email" required>
  <textarea placeholder="Your Message" required></textarea>
  <button type="submit">Send</button>
</form>

</body>
</html>
